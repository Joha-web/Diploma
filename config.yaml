# ═══════════════════════════════════════════════════════════════
#  ReconX — Configuration
#  Edit this file before running. Keep API keys out of git.
# ═══════════════════════════════════════════════════════════════

# ── API Keys (optional — improves results) ───────────────────
api_keys:
  shodan:     ""
  virustotal: ""
  wpscan:     ""
  censys_api_id: ""
  censys_api_secret: ""
  securitytrails: ""
  binaryedge:  ""
  github:     ""
  pdcp:       ""

# Optional scan profile override: safe | bug_bounty | deep | intrusive.
preset: ""

# Optional auth contexts for access-control diffing. Keep real tokens in env/local files.
auth_profiles:
  anonymous: {}
  user_a:
    token: ""
    token_type: "Bearer"
    headers: {}
    cookies: {}
  user_b:
    token: ""
    token_type: "Bearer"
    headers: {}
    cookies: {}
  admin:
    token: ""
    token_type: "Bearer"
    headers: {}
    cookies: {}

# ── Telegram Notifications ───────────────────────────────────
telegram:
  enabled:   true
  bot_token: ""
  chat_id:   ""
  notify_on:
    - start
    - module_complete
    - critical_finding
    - complete

# ── AI Analysis (Ollama — local, free) ───────────────────────
ai:
  enabled:       true
  provider:      "ollama"          # ollama | openai
  model:         "deepseek-r1:7b"  # deepseek-r1:14b needs ~10GB RAM
  ollama_url:    "http://localhost:11434"
  # OpenAI-compatible fallback (groq.com, openrouter.ai are free)
  openai_api_key:  ""
  openai_base_url: "https://api.openai.com/v1"
  temperature:   0.3
  max_tokens:    4096
  language:      "en"              # en | ru
  realtime_advice: true            # send short per-module AI notes to Telegram
  advise_on: [recon, portscan, techstack, fuzzer, vulnscan, cve_check]

# ── Scan Settings ────────────────────────────────────────────
scan:
  threads:    50
  timeout:    30
  rate_limit: 50
  global_rate_limit: 50       # aggregate in-process HTTP requests/sec
  allow_write: false          # blocks write-like HTTP methods by default

  # Subdomain sources
  subdomains:
    use_subfinder:    true
    use_amass:        true
    use_assetfinder:  true
    use_crtsh:        true
    use_hackertarget: true
    use_alienvault:   true
    use_rapiddns:     true
    use_wayback_cdx:  true
    use_threatminer:  true
    use_shodan:       true
    use_censys:       true
    use_github:       true
    use_securitytrails: false  # disabled by default to avoid free-tier quota burn
    use_binaryedge:   false    # disabled by default to avoid free-tier quota burn
    api_retries:      1         # retry passive API 429/5xx/request failures
    api_retry_delay:  1.0       # initial retry delay in seconds
    api_retry_backoff: 2.0      # delay multiplier after each retry
    api_retry_max_delay: 10.0   # cap Retry-After/backoff delays
    wayback_timeout:  15        # seconds; CDX often stalls on large domains
    wayback_limit:    1000      # lower is faster and less likely to time out
    github_per_page:  30        # GitHub code search results to inspect
    amass_timeout:    180       # seconds (amass can be slow)
    enable_active_enum: false    # alias requested in sprint spec
    use_active_bruteforce: false # active dnsx -w wordlist -d domain
    active_wordlist: "subdomains-top1million-5000.txt"
    active_threads: 100
    active_timeout: 900
    use_asn_lookup: false       # network owner hints for resolved /24s
    max_asn_lookups: 40
    asn_lookup_delay: 1.0       # seconds between ipinfo lookups
    exclude_cdn_ips: true       # when ASN lookup is enabled, keep CDN/cloud IPs out of portscan
    # altdns-style permutation brute-force (requires dnsx; gotator optional)
    use_permutations: false
    permutation_extra_words: []  # extra keywords to mix into permutation set
    permutation_max: 5000        # cap candidates before dnsx validation
    permutation_threads: 100
    permutation_timeout: 600
    # origin-IP discovery for hosts behind a CDN/WAF (uses SecurityTrails when key set)
    use_origin_discovery: false
    origin_max_lookups: 50
    # extended URL harvesting per live host
    use_katana: false           # active crawl with katana (chrome headless)
    katana_depth: 2
    katana_timeout: 300
    use_well_known: true        # passive: robots, sitemap, security.txt, /.well-known/*
    well_known_max_hosts: 50
    well_known_timeout: 10
    # reverse-WHOIS / org-pivoting via crt.sh ?O= search (needs Organization in WHOIS)
    use_reverse_whois: false
    reverse_whois_max_domains: 100
    # active S3/GCS/Azure bucket guessing seeded from domain + sub labels + WHOIS org
    use_cloud_buckets: false
    cloud_bucket_extra_words: []
    cloud_bucket_max: 2000
    cloud_bucket_threads: 20
    cloud_bucket_timeout: 5
    # collect TLS-cert SANs per live host; same-domain SANs auto-merge into subdomains
    use_cert_san_graph: false
    cert_san_max_hosts: 80
    cert_san_timeout: 5
    # synthesis step: tie sub ↔ IP ↔ ASN ↔ cert ↔ tech ↔ endpoints into asset_graph.json
    build_asset_graph: true

  # GitHub repository secret scanning
  secret_scanner:
    enabled: true
    max_repos: 20
    github_per_page: 20
    github_timeout: 15
    clone_timeout: 120
    scan_timeout: 120

  # Port scanning
  ports:
    mode:         "top-1000"    # top-100 | top-1000 | full (65535)
    scanner:      "nmap"        # nmap | masscan (masscan = faster)
    masscan_rate: 3000          # packets/sec — lower for stealth

  # HTTP probing
  http:
    follow_redirects: true
    tech_detect:      true
    screenshots:      false     # requires gowitness; output under recon/screenshots/
    screenshot_threads: 5
    screenshot_timeout: 600

  # Directory fuzzing
  fuzzing:
    depth:        3
    rate:         100           # requests/sec per host
    graphql_probe: true
    graphql_introspection: true
    robots_sitemap: true
    cloud_assets: true
    cloud_listing_threads: 10
    reuse_host_outputs: true
    extensions:   [".php", ".asp", ".aspx", ".jsp", ".html", ".js", ".json"]

  cors_checker:
    enabled: true
    max_urls: 200

  auth_probe:
    enabled: true
    max_urls: 150

  sourcemap_analyzer:
    enabled: true
    max_js: 150

  vhost_enum:
    enabled: true
    max_ips: 40
    rate: 50
    timeout: 600
    wordlist: "subdomains-top1million-5000.txt"

  openapi_parser:
    enabled: true
    max_hosts: 100

  parameter_discovery:
    enabled: true
    max_targets: 150
    threads: 10
    delay: 2
    timeout: 1200

  injection_probe:
    enabled: true
    max_targets: 50
    max_ssti_requests: 250
    max_ssrf_requests: 150
    timeout: 15
    ssrf_wait: 5
    ssti: true
    ssrf: true
    inband_ssrf: false

  sql_injection:
    enabled: true
    max_targets: 10
    timeout: 900
    level: 1
    risk: 1
    threads: 1
    request_timeout: 10
    retries: 1
    smart: true
    random_agent: true
    forms: false
    crawl: 0
    tamper: ""
    extra_args: []

  xss:
    enabled: true
    max_targets: 25
    timeout: 600
    use_dalfox: true
    fallback_reflection: true
    max_requests: 150
    max_payloads: 2
    request_timeout: 10
    workers: 1
    dalfox_timeout: 600
    dalfox_extra_args: []

  http_smuggling:
    enabled: true
    max_urls: 40
    timing_threshold: 4.5
    connect_timeout: 8
    read_timeout: 6

  oauth_probe:
    enabled: true
    max_hosts: 40
    timeout: 8

  cache_poison:
    enabled: true
    max_urls: 60
    max_headers: 9
    timeout: 10
    confirm_cache: false
    cache_wait: 1

  host_header_injection:
    enabled: true
    max_urls: 80
    timeout: 10

  prototype_pollution:
    enabled: true
    max_targets: 80
    timeout: 10
    body_probes: false

  xxe_probe:
    enabled: true
    max_targets: 40
    timeout: 10
    oob_wait: 5

  deserialization_probe:
    enabled: true
    max_urls: 100
    timeout: 10

  graphql_audit:
    enabled: true
    max_endpoints: 30
    batch_size: 8
    depth: 12
    timeout: 10

  race_condition:
    enabled: true
    max_targets: 80
    active_probe: false
    max_active_targets: 5
    parallel_requests: 2
    timeout: 8

  open_redirect_probe:
    enabled: true
    max_targets: 120
    timeout: 8

  api_key_validator:
    enabled: true
    max_candidates: 100
    live_validation: false
    timeout: 10

  idor_probe:
    enabled: true
    max_candidates: 200
    compare_profiles: false      # set true when auth_profiles.user_a and user_b are configured
    check_anonymous: false
    max_compare_requests: 40
    max_anonymous_requests: 20
    similarity_threshold: 0.92
    timeout: 10

  jwt_audit:
    enabled: true
    max_tokens: 100
    collect_from_responses: false
    max_response_urls: 50
    max_token_ttl_seconds: 604800 # 7 days
    max_secret_guesses: 50
    weak_secrets: []
    trusted_key_hosts: []
    timeout: 10

  websocket_probe:
    enabled: true
    max_hosts: 30
    max_endpoints: 50
    discover_common_paths: true
    active_handshake: true
    check_origin: true
    attacker_origin: "https://attacker.reconx.invalid"
    message_probe: false         # only runs when scan.allow_write is true
    timeout: 8

  api_schema_audit:
    enabled: true
    max_endpoints: 500

  js_security_audit:
    enabled: true
    max_js: 150
    max_html_hosts: 40
    max_findings_per_js: 20
    timeout: 10

  takeover_checker:
    enabled: true
    max_hosts: 500

  # Nuclei vulnerability scanner
  nuclei:
    enabled: true
    severity:
      - critical
      - high
      - medium
    templates:
      - cves
      - exposures
      - misconfiguration
      - takeovers
    enable_risky: false
    exclude_tags:
      - dos
      - intrusive
      - bruteforce
      - destructive
    rate_limit:     150
    waf_rate_limit: 30
    waf_scan_strategy: host-spray
    waf_exclude_tags: [fuzz, fuzzing, bruteforce, headless]
    nuclei_timeout: 3600        # 1 hour max
    dashboard_upload: true     # true uploads nuclei results to PDCP when PDCP_API_KEY is set
    oob:
      enabled: true             # enables nuclei Interactsh/OOB templates
      auto_client: true         # start interactsh-client and record payload/interactions
      interactsh_server: ""     # optional custom server, e.g. https://oast.pro
      interactsh_token: ""
      registration_timeout: 10
      cooldown_period: 5

  correlator:
    enabled: true

  # CVE and ExploitDB correlation. This module never executes public exploit code.
  cve_check:
    enabled: true
    searchsploit: true
    max_queries: 40
    attack_simulation: dry_run

  # CMS scanning
  cms:
    wpscan_api_token: ""        # optional override; falls back to config.api_keys.wpscan / WPSCAN_API_TOKEN
    enumerate: "vp,vt,u,tt"    # vp=plugins, vt=themes, u=users, tt=timthumbs

# ── Wordlists ────────────────────────────────────────────────
wordlists:
  search_paths:
    - /opt/SecLists
    - /usr/share/seclists
    - /usr/share/wordlists
    - /usr/share/dirb/wordlists
  dirs:   "directory-list-2.3-medium.txt"
  files:  "raft-medium-files.txt"
  params: "burp-parameter-names.txt"

# ── Reporting ────────────────────────────────────────────────
reporting:
  formats:
    - html
    - json
  language: "en"

# Scope enforcement for target-bound HTTP requests.
scope:
  enforce: true
  allowed_domains: []       # empty means the target domain and its subdomains
  allowed_ips: []           # add IPs explicitly when they are in scope
  excluded: []

legal:
  require_acknowledgment: false

# Optional user-defined overrides layered after built-in presets.
config_presets: {}
