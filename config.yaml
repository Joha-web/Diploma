# ═══════════════════════════════════════════════════════════════
#  ReconX — Configuration
#  Edit this file before running. Keep API keys out of git.
# ═══════════════════════════════════════════════════════════════

# ── API Keys (optional — improves results) ───────────────────
api_keys:
  shodan:     ""
  virustotal: ""
  wpscan:     ""          # or env WPSCAN_API_TOKEN; free at https://wpscan.com/register
  censys_api_id: ""            # optional; only needed for Legacy Search API
  censys_api_secret: ""        # Platform PAT, or Legacy secret when censys_api_id is set
  securitytrails: ""
  binaryedge:  ""
  github:     ""
  pdcp:       ""

# ── Telegram Notifications ───────────────────────────────────
telegram:
  enabled:   true
  bot_token: ""           # Use env TELEGRAM_BOT_TOKEN
  chat_id:   ""           # Use env TELEGRAM_CHAT_ID
  notify_on:
    - start
    - module_complete
    - critical_finding
    - complete

# ── AI Analysis (Ollama — local, free) ───────────────────────
ai:
  enabled:       true
  provider:      "ollama"          # ollama | openai
  model:         "deepseek-r1:7b"  # deepseek-r1:14b needs ~10GB RAM
  ollama_url:    "http://localhost:11434"
  # OpenAI-compatible fallback (groq.com, openrouter.ai are free)
  openai_api_key:  ""
  openai_base_url: "https://api.openai.com/v1"
  temperature:   0.3
  max_tokens:    4096
  language:      "en"              # en | ru

# ── Scan Settings ────────────────────────────────────────────
scan:
  threads:    50
  timeout:    30
  rate_limit: 50
  global_rate_limit: 50       # aggregate in-process HTTP requests/sec
  allow_write: false          # blocks write-like HTTP methods by default

  # Subdomain sources
  subdomains:
    use_subfinder:    true
    use_amass:        true
    use_assetfinder:  true
    use_crtsh:        true
    use_hackertarget: true
    use_alienvault:   true
    use_rapiddns:     true
    use_wayback_cdx:  true
    use_threatminer:  true
    use_shodan:       true
    use_censys:       true
    use_github:       true
    wayback_timeout:  15        # seconds; CDX often stalls on large domains
    wayback_limit:    1000      # lower is faster and less likely to time out
    github_per_page:  30        # GitHub code search results to inspect
    amass_timeout:    180       # seconds (amass can be slow)

  # Port scanning
  ports:
    mode:         "top-1000"    # top-100 | top-1000 | full (65535)
    scanner:      "nmap"        # nmap | masscan (masscan = faster)
    masscan_rate: 3000          # packets/sec — lower for stealth

  # HTTP probing
  http:
    follow_redirects: true
    tech_detect:      true
    screenshots:      false     # requires gowitness

  # Directory fuzzing
  fuzzing:
    depth:        3
    rate:         100           # requests/sec per host
    extensions:   [".php", ".asp", ".aspx", ".jsp", ".html", ".js", ".json"]

  # Nuclei vulnerability scanner
  nuclei:
    enabled: true
    severity:
      - critical
      - high
      - medium
    templates:
      - cves
      - exposures
      - misconfiguration
      - takeovers
    enable_risky: false
    exclude_tags:
      - dos
      - intrusive
      - bruteforce
      - destructive
    rate_limit:     150
    nuclei_timeout: 3600        # 1 hour max
    dashboard_upload: false     # true uploads nuclei results to PDCP when PDCP_API_KEY is set

  # CVE and ExploitDB correlation. This module never executes public exploit code.
  cve_check:
    enabled: true
    searchsploit: true
    max_queries: 40
    attack_simulation: dry_run

  # CMS scanning
  cms:
    wpscan_api_token: ""        # optional override; falls back to config.api_keys.wpscan / WPSCAN_API_TOKEN
    enumerate: "vp,vt,u,tt"    # vp=plugins, vt=themes, u=users, tt=timthumbs

# ── Wordlists ────────────────────────────────────────────────
wordlists:
  search_paths:
    - /opt/SecLists
    - /usr/share/seclists
    - /usr/share/wordlists
    - /usr/share/dirb/wordlists
  dirs:   "directory-list-2.3-medium.txt"
  files:  "raft-medium-files.txt"
  params: "burp-parameter-names.txt"

# ── Reporting ────────────────────────────────────────────────
reporting:
  formats:
    - html
    - md
    - json
  language: "en"

# Scope enforcement for target-bound HTTP requests.
scope:
  enforce: true
  allowed_domains: []       # empty means the target domain and its subdomains
  allowed_ips: []           # add IPs explicitly when they are in scope
  excluded: []

legal:
  require_acknowledgment: false
